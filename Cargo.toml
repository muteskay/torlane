[package]
name = "torlane"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Runs a Tor process and hands out isolated SOCKS5 lanes"
readme = "README.MD"
license = "MIT OR Apache-2.0"

[features]
default = []
reqwest = ["dep:reqwest"]

[dependencies]
hmac = "^0.13"
rand = "^0.10"
reqwest = { version = "^0.13", optional = true, default-features = false, features = ["socks", "rustls"] }
sha2 = "^0.11"
thiserror = "^2"
tokio = { version = "^1.50", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "^0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[example]]
name = "reqwest"
path = "examples/reqwest.rs"
required-features = ["reqwest"]
