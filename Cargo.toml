[package]
name = "torlane"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Runs a Tor process and hands out isolated SOCKS5 lanes"
readme = "README.MD"
license = "MIT OR Apache-2.0"

[dependencies]
hmac = "0.12"
rand = "0.8"
sha2 = "0.10"
thiserror = "^2"
tokio = { version = "1.49", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
